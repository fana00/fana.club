const DOC_KEYS=["privacy","terms","support","delete"];
const LANG_ATTR={en:"en",ko:"ko",ja:"ja",zh:"zh-Hant"};
const LN={"en":"EN","ko":"KO"}; /* JA·ZH 숨김: 다시 열려면 "ja":"JA","zh":"ZH" 추가 */const EYE={"en":"Aiya · Legal","ko":"Aiya · 정책","ja":"Aiya · ポリシー","zh":"Aiya · 政策"};
const STATIC={privacy:"/privacy/",terms:"/terms/",support:"/support/","delete":"/delete-account/"};
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fill(h){return h.replace(/\{\{(\w+)\}\}/g,(m,k)=>{const v=CONFIG[k];if(v==null)return m;return v.startsWith("[")?'<span class="ph">'+esc(v)+'</span>':esc(v)})}
function href(d,l){return l==="en"?STATIC[d]:"#"+d+"-"+l}
function parse(){const m=(location.hash||"").slice(1).match(/^(privacy|terms|support|delete)-(en|ko)$/);if(m)return{doc:m[1],lang:m[2]};let l="en";try{const n=(navigator.language||"en").toLowerCase();if(n.startsWith("ko"))l="ko";}catch(e){}return{doc:"privacy",lang:l}}
function render(){const {doc,lang}=parse();if(lang==="en"&&location.hash){location.replace(STATIC[doc]);return}
const ui=UI[lang];document.documentElement.lang=LANG_ATTR[lang];
document.getElementById("home").href=lang==="ko"?"/kr/":"/";
const tabs=DOC_KEYS.map(k=>'<a href="'+href(k,lang)+'"'+(k===doc?' aria-current="page"':'')+'>'+ui[k]+'</a>').join("");
const langs=Object.keys(LN).map(x=>'<a href="'+href(doc,x)+'"'+(x===lang?' class="on"':'')+'>'+LN[x]+'</a>').join("");
document.getElementById("tabs").innerHTML=tabs+'<span class="langs">'+langs+'</span>';
document.getElementById("flinks").innerHTML=DOC_KEYS.map(k=>'<a href="'+href(k,lang)+'">'+ui[k]+'</a>').join("");
const dated=doc==="privacy"||doc==="terms";
document.getElementById("doc").innerHTML='<p class="eyebrow mono">'+EYE[lang]+'</p><h1>'+ui[doc]+'</h1>'+(dated?'<p class="meta mono">'+ui.eff+' · '+fill("{{DATE}}")+'</p>':'')+'<div class="rule"></div>'+fill(DOCS[lang][doc])+'<p class="note">'+fill(ui.foot)+'</p>';
document.title="Aiya · "+ui[doc];window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("button.copy");if(!b)return;const {lang}=parse();const val=CONFIG[b.dataset.copy]||"";const done=()=>{b.textContent=UI[lang].copied;setTimeout(()=>b.textContent=UI[lang].copy,1500)};try{navigator.clipboard.writeText(val).then(done,()=>{})}catch(err){}});
window.addEventListener("hashchange",render);render();
</script>
